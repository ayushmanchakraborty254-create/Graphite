name: Auto Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date +%s%3N)
          ./gradlew assembleDebug -PgitCommitSha=$SHORT_SHA -PbuildTimeMillis=$BUILD_TIME --no-daemon

      - name: Prepare APK Artifacts
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "date=$BUILD_DATE" >> $GITHUB_OUTPUT
          
          # Find generated APK and copy to release names
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" Graphite-latest.apk
          cp "$APK_PATH" Graphite-v1.0.0.apk
          ls -lh Graphite-latest.apk

      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Graphite Auto-Build (${{ steps.vars.outputs.sha }})"
          body: |
            ## 🚀 Graphite Continuous Delivery Build
            - **Commit:** `${{ steps.vars.outputs.sha }}`
            - **Message:** ${{ steps.vars.outputs.msg }}
            - **Build Timestamp:** ${{ steps.vars.outputs.date }}
            
            This APK is automatically compiled and published on every commit pushed to `main`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Graphite-latest.apk
            Graphite-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
